# This workflow generates the animated contribution snake for your profile README
name: Generate Snake

# Controls when the workflow will run
on:
  # Runs on every push to main
  push:
    branches: [ "main" ]
  # Keeps the snake fresh even with no pushes
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    permissions:
      contents: write
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Generates the snake SVGs from your contribution graph
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: kaflebiplob
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Pushes the generated SVGs to the "output" branch so the README can pull them in
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
